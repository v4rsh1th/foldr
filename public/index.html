<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Foldr · PDF tools</title>
  <meta name="description" content="Merge, split, organize, rotate and compress PDFs in your browser.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="vendor/inter@5.3.0/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="Foldr home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#4f46e5"/>
          <path d="M10 7h8.5L23 11.5V25H10z" fill="#fff"/>
          <path d="M18.5 7v4.5H23" fill="#c7cbfb"/>
          <path d="M13 16h7M13 19.5h7" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Foldr</span>
      </a>
      <div class="header-meta">
        <span id="network-status" class="pill" role="status" hidden></span>
      </div>
    </div>
  </header>

  <main id="main" class="app-main container" tabindex="-1">
    <div id="view">
      <noscript>
        <p>Foldr needs JavaScript to process PDFs in your browser. Please enable it and reload.</p>
      </noscript>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container footer-inner">
      <p>Foldr <span id="app-version"></span></p>
      <p>Files are processed locally in your browser.</p>
    </div>
  </footer>

  <div id="toast-region" class="toast-region"></div>
  <div id="sr-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
